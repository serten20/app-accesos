<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambiar Contraseña — Gestión de Accesos</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-300 min-h-screen flex items-center justify-center font-mono">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-warning/10 border border-warning/30 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-warning" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-warning tracking-wider">CAMBIO DE CONTRASEÑA</h1>
      <p class="text-xs text-base-content/40 mt-1">Hola <b class="text-base-content">{{ user.username }}</b>, debes establecer una nueva contraseña antes de continuar.</p>
    </div>

    <div class="card bg-base-100 shadow-xl border border-base-200">
      <div class="card-body gap-5">

        {% if error %}
        <div class="alert alert-error py-2 text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/change-password" class="flex flex-col gap-4">
          <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}"/>
          <div class="form-control">
            <label class="label pb-1"><span class="label-text text-xs tracking-wider uppercase text-base-content/50">Nueva Contraseña</span></label>
            <input type="password" name="new_password" required autofocus minlength="6"
              class="input input-bordered input-sm bg-base-200 focus:border-warning"
              placeholder="Mínimo 6 caracteres" />
          </div>
          <div class="form-control">
            <label class="label pb-1"><span class="label-text text-xs tracking-wider uppercase text-base-content/50">Confirmar Contraseña</span></label>
            <input type="password" name="confirm_password" required minlength="6"
              class="input input-bordered input-sm bg-base-200 focus:border-warning"
              placeholder="Repite la contraseña" />
          </div>
          <button type="submit" class="btn btn-warning btn-sm mt-2 tracking-wider">
            GUARDAR Y CONTINUAR
          </button>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="/logout" class="text-xs text-base-content/30 hover:text-error">Cerrar sesión</a>
    </div>
  </div>

</body>
</html>

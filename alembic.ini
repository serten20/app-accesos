# Configuración de Alembic para Gestión de Accesos.
# La URL real se inyecta en alembic/env.py desde la variable DATABASE_URL
# (o el default de database.py), por lo que aquí queda como placeholder.
[alembic]
script_location = alembic
prepend_sys_path = .
# Plantilla de nombre de fichero de migración: 0001_descripcion.py
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///./data/accesos.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
